# nginx config for docker-compose.replicas.yml.
events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS. Re-resolving the replica names keeps a recreated
    # replica reachable at its new address without reloading nginx; `resolve`
    # on the server lines below needs nginx 1.27.3 or later.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream jina_backends {
        zone jina_backends 64k;
        # Send each request to the replica with the fewest in flight. Request cost
        # varies widely (a reranker call over long documents takes many times as
        # long as one over short ones), so round-robin would pile work onto
        # whichever replica drew the slow requests.
        least_conn;
        server jina-1:8080 resolve max_fails=3 fail_timeout=30s;
        server jina-2:8080 resolve max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8080;

        # The default is 1m, which rejects multimodal requests carrying base64 images.
        # Matches the limit on the Ingress in k8s/jina-on-prem.yaml.
        client_max_body_size 32m;

        location / {
            proxy_pass http://jina_backends;
            # A replica whose model worker has died answers every request at once
            # with 503. Count that as a failure so max_fails takes it out of
            # rotation, and retry on the other replica. Embedding and rerank calls
            # have no side effects, so retrying a POST is safe.
            proxy_next_upstream error timeout http_503 non_idempotent;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }
    }
}
