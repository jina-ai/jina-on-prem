# Two-container deploy: embedding + reranker.
#
# Use the same MODEL variants for either CPU or GPU. To run all on GPU, add the
# `deploy` block from docker-compose.yml under each service.
#
# Images are looked up by their local name, jina/<model>:<runtime>; see
# docker-compose.yml for how to get that name after a manual pull from ghcr.io.
#
# Usage:
#   docker compose -f docker-compose.multi.yml up -d
#   curl http://localhost:8080/health     # embed
#   curl http://localhost:8081/health     # rerank
#
# Both expose the same multi-schema API. Point your retrieval app at 8080 and
# your reranking step at 8081.
#
# A model served on vLLM (`runtime: vllm_chat` in models/catalog.json)
# pre-allocates most of the GPU's memory at startup and would leave nothing for
# a second service on the same card. To share one GPU, give it
# `JINA_GPU_MEMORY_FRACTION` under `environment:` (the default is the model's
# `gpu_memory_utilization` in the catalog) and size the other model into what
# remains; and give its service `shm_size: 2g` and a longer healthcheck
# `start_period`, as docker-compose.yml does.

services:
  embed:
    image: jina/jina-embeddings-v5-text-small:cpu
    container_name: jina-embed
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  rerank:
    image: jina/jina-reranker-v3:cpu
    container_name: jina-rerank
    ports:
      - "8081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
